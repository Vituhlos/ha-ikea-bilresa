name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 05:17 UTC: early warning for upcoming Home Assistant changes.
    - cron: "17 5 * * 1"

jobs:
  hassfest:
    name: Validate manifest (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: Validate HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

  mypy:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install mypy
      - run: mypy

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check custom_components/ikea_bilresa/frontend/ikea_bilresa_panel.js
      - run: node --test tests/panel_frontend.test.mjs tests/iconset_frontend.test.mjs

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-test.txt
      - run: >-
          pytest -q
          --cov=custom_components/ikea_bilresa
          --cov-report=term-missing
          --cov-report=xml

  prerelease:
    name: Unit tests (newest Home Assistant pre-release)
    # Reports only. A failure here means a future Home Assistant release will
    # break something; it must not block a pull request against today's pins.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Each release of the test helper pins the Home Assistant version it was
      # built for, betas included, so its newest release brings the newest
      # Home Assistant pre-release together with matching pytest plugins.
      - run: pip install --upgrade pytest-homeassistant-custom-component
      - run: pip list | grep -i -E "^homeassistant |pytest-homeassistant"
      - run: pytest -q
