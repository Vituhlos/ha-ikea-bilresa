name: Stale issues

# Only an issue the maintainer labelled `needs-info` (waiting for the reporter's
# logs, version or answer) is ever marked stale, and only after three weeks;
# it is closed two weeks later unless someone answers. Pull requests and
# every other issue are left alone. After a reporter answers, the maintainer
# removes `needs-info`; the last step then removes a leftover `stale` label.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          only-labels: needs-info
          days-before-stale: 21
          days-before-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          remove-stale-when-updated: true
          stale-issue-message: >-
            Still waiting for the information asked for above. If you can
            provide it, please add a comment and this issue stays open;
            otherwise it will be closed in two weeks. It can be reopened any time.
          close-issue-message: >-
            Closed for now because the information asked for did not arrive.
            Please reopen it, or open a new issue, when you can add it.
      - name: Remove `stale` from issues that no longer wait for information
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue list --state open --label stale --limit 1000 --json number,labels \
            --jq '.[] | select(all(.labels[]; .name != "needs-info")) | .number' |
            xargs -r -I{} gh issue edit {} --remove-label stale
