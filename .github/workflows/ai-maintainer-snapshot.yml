name: Contribution assessment snapshot (read-only, no AI)

on:
  workflow_dispatch:
    inputs:
      item:
        description: "Issue or PR number / Číslo issue nebo PR"
        required: true
        type: string

permissions: {}

concurrency:
  group: ai-maintainer-read-only-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: >-
      github.repository == 'Vituhlos/ha-ikea-bilresa' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Vituhlos' && github.triggering_actor == 'Vituhlos'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Collect bounded repository evidence
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_ITEM: ${{ inputs.item }}
          SNAPSHOT_TOOL_SHA: ${{ github.sha }}
        run: node tools/ai_maintainer/snapshot.mjs
      - name: Store diagnostic report (public repository artifact)
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assessment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            snapshot-output/report.json
            snapshot-output/summary.md
          retention-days: 14
          if-no-files-found: ignore
      - name: Store non-authoritative receipt
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assessment-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshot-output/state.json
          retention-days: 90
          if-no-files-found: ignore
