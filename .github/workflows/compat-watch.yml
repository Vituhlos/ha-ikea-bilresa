name: Compatibility watch

# Once a week: is there a newer Home Assistant, Matter Server app or
# matterjs-server than the ones the integration was last checked against?
# If so, one issue says so and lists what to check. It only reports.
on:
  schedule:
    - cron: "40 6 * * 1"
  workflow_dispatch:

# One run at a time: two runs must not both create the issue.
concurrency:
  group: compat-watch

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Compare the newest releases with the tested ones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python tools/compat_watch.py
        env:
          GH_TOKEN: ${{ github.token }}
          # Assigned and mentioned, so GitHub notifies the owner.
          COMPAT_NOTIFY: ${{ github.repository_owner }}
