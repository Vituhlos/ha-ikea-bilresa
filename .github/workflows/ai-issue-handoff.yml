name: AI issue handoff (owner-only, no model calls)

# A maintainer's exact issue comment prepares a prompt; AI never runs here.
# GitHub runs issue_comment workflows from the trusted default branch.
on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: ai-issue-handoff-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Codex Cloud task prompt
    if: >-
      github.actor == 'Vituhlos' &&
      !github.event.issue.pull_request &&
      (
        github.event.comment.body == '/agent prepare dev' ||
        github.event.comment.body == '/agent prepare main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # Explicitly pin helper code to trusted main. Never checkout a fork.
      - name: Checkout trusted workflow code
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Prepare owner-authorized task handoff
        uses: actions/github-script@v8
        with:
          script: |
            const { runHandoff } = await import(
              process.env.GITHUB_WORKSPACE + '/tools/agent_handoff.mjs'
            );
            const result = await runHandoff({
              github,
              context,
              actor: context.actor,
              eventName: context.eventName,
            });
            core.notice(
              'Prepared an issue handoff; NO Codex task or other AI execution started.'
            );
            await core.summary.addHeading('Codex Cloud handoff prepared')
              .addRaw('Issue #' + result.issueNumber + ', PR base: ' +
                result.baseBranch + '. No AI model was invoked.')
              .addBreak()
              .addLink('Open issue and copy the prompt', result.url)
              .write();
